<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>掃描卡片轉換器</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
  <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
  <rect width='100' height='100' rx='22' fill='%232f6fed'/>
  <path d='M25 35h12l6-8h20l6 8h6a8 8 0 0 1 8 8v27a8 8 0 0 1-8 8H25a8 8 0 0 1-8-8V43a8 8 0 0 1 8-8z' fill='white'/>
  <circle cx='50' cy='55' r='15' fill='%232f6fed'/>
  <circle cx='50' cy='55' r='9' fill='white'/>
  </svg>">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1f1f1d;--mu:#6b6a65;--bd:#dcdad3;--ac:#2f6fed;--ac2:#e8effd;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--tx:#ecebe6;--mu:#9a9992;--bd:#3a3a36;--ac:#6b9bff;--ac2:#26324d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--tx:#ecebe6;--mu:#9a9992;--bd:#3a3a36;--ac:#6b9bff;--ac2:#26324d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px}
h1{margin:0 0 2px;font-size:20px}p.sub{margin:0 0 14px;color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.drop{border:2px dashed var(--bd);border-radius:10px;padding:34px 10px;text-align:center;color:var(--mu);cursor:pointer}
.drop.over{border-color:var(--ac);background:var(--ac2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label{font-size:13px;color:var(--mu);display:flex;gap:4px;align-items:center}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
input[type=number]{width:76px}
input[type=text]{width:100px}
textarea{width:100%;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;resize:vertical}
.it input.nm{width:100%;margin-bottom:2px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.45;cursor:not-allowed}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.it{border:1px solid var(--bd);border-radius:10px;padding:8px;background:var(--card)}
.it img{width:100%;display:block;border-radius:6px;background:var(--bd)}
.it .n{font-size:12px;color:var(--mu);margin:6px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it button{width:100%}
#msg{font-size:13px;color:var(--mu)}
</style>
</head>
<body>
<main>
<h1>掃描卡片轉換器</h1>
<p class="sub">可上傳 PDF 或圖片，自動旋轉並裁切成固定尺寸（PDF 會每頁各轉成一張）。照片只在你的瀏覽器內處理，不會上傳。</p>
<div class="card">
  <div class="drop" id="drop">拖曳 PDF／掃描檔到這裡，或點擊選擇<input type="file" id="file" multiple accept="image/*,application/pdf,.pdf" hidden></div>
</div>
<div class="card">
  <div class="row">
    <label>旋轉<select id="rot"><option value="1">順時針 90°</option><option value="3">逆時針 90°</option><option value="2">180°</option><option value="0">不旋轉</option></select></label>
    <label>X<input type="number" id="cx" value="10.4" step="0.1">%</label>
    <label>Y<input type="number" id="cy" value="23.6" step="0.1">%</label>
    <label>寬<input type="number" id="cw" value="79.0" step="0.1">%</label>
    <label>高<input type="number" id="ch" value="55.9" step="0.1">%</label>
    <span style="font-size:12px;color:var(--mu)">以旋轉後的圖為基準</span>
  </div>
</div>
<div class="card">
  <div class="row">
    <label><input type="checkbox" id="auto" checked>自動編號</label>
    <label>前綴<input type="text" id="pre"></label>
    <label>起始<input type="number" id="start" value="1" min="0"></label>
    <label>位數<input type="number" id="digits" value="4" min="1" max="8"></label>
    <button id="renum">重新編號</button>
  </div>
  <div class="row" style="margin-top:8px"><label><input type="checkbox" id="cont">下載 ZIP 後自動清空清單，並接續下一個編號</label></div>
  <div style="font-size:12px;color:var(--mu);margin-top:6px">每張卡片下方的檔名欄也可以單獨修改。</div>
</div>
<div class="card">
  <div class="row" style="margin-bottom:8px">
    <label>圖片資料夾<input type="text" id="dir" value="images/"></label>
    <button id="cp">複製程式碼</button><span id="cpmsg" style="font-size:13px;color:var(--mu)"></span>
  </div>
  <textarea id="code" rows="6" readonly placeholder="加入照片後，這裡會產生可貼到網站的程式碼"></textarea>
</div>
<div class="row" style="margin-bottom:12px">
  <button id="dlz" class="pri" disabled>下載全部（ZIP）</button>
  <button id="clr" disabled>清空</button>
  <span id="msg"></span>
</div>
<div id="grid"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const items=[];
const IDS=['rot','cx','cy','cw','ch'];
const PDF_DPI=200;
const NV=['pre','start','digits','dir'],NC=['auto','cont'];
try{const p=JSON.parse(localStorage.getItem('cardNaming')||'null');if(p){NV.forEach(k=>{if(p[k]!==undefined)$('#'+k).value=p[k]});NC.forEach(k=>{if(p[k]!==undefined)$('#'+k).checked=p[k]})}}catch(e){}
function persist2(){try{const o={};NV.forEach(k=>o[k]=$('#'+k).value);NC.forEach(k=>o[k]=$('#'+k).checked);localStorage.setItem('cardNaming',JSON.stringify(o))}catch(e){}}
function applyNames(){
  const pre=$('#pre').value,st=parseInt($('#start').value)||0,dg=Math.max(1,parseInt($('#digits').value)||1),auto=$('#auto').checked;
  items.forEach((it,i)=>{if(it.base===undefined)it.base=it.name;if(it.manual)return;it.name=auto?pre+String(st+i).padStart(dg,'0'):it.base});
}
function updateCode(){
  const dir=$('#dir').value,q=t=>String(t).split('\\').join('\\\\').split('"').join('\\"');
  $('#code').value=items.map(it=>'  { image: "'+q(dir+it.name+'.jpg')+'", title: "", author: "", featured: false },').join('\n');
}
try{const p=JSON.parse(localStorage.getItem('cardCrop')||'null');if(p)IDS.forEach(k=>{if(p[k])$('#'+k).value=p[k]})}catch(e){}
function params(){const g=k=>(parseFloat($('#'+k).value)||0)/100;return{x:g('cx'),y:g('cy'),w:g('cw'),h:g('ch')}}

function convert(img){
  const RW=img.width,RH=img.height,k=parseInt($('#rot').value)||0; // 原始像素（不套用 EXIF）
  const W=k%2?RH:RW,H=k%2?RW:RH;
  const r=document.createElement('canvas');r.width=W;r.height=H;
  const g=r.getContext('2d');
  if(k===1){g.translate(RH,0);g.rotate(Math.PI/2)}
  else if(k===2){g.translate(RW,RH);g.rotate(Math.PI)}
  else if(k===3){g.translate(0,RW);g.rotate(-Math.PI/2)}
  g.drawImage(img,0,0);
  const p=params();
  const sx=Math.max(0,Math.round(p.x*W)),sy=Math.max(0,Math.round(p.y*H));
  const sw=Math.max(1,Math.min(W-sx,Math.round(p.w*W))),sh=Math.max(1,Math.min(H-sy,Math.round(p.h*H)));
  const o=document.createElement('canvas');o.width=sw;o.height=sh;
  o.getContext('2d').drawImage(r,sx,sy,sw,sh,0,0,sw,sh);
  return o;
}
const toBlob=c=>new Promise(res=>c.toBlob(res,'image/jpeg',.92));

const isPdf=f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name);
let pdfReady=false;
async function initPdf(){
  if(pdfReady)return;
  if(!window.pdfjsLib)throw new Error('PDF 元件載入失敗，請確認網路連線');
  const url='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const t=await (await fetch(url)).text();
  pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:'text/javascript'}));
  pdfReady=true;
}
async function addPdf(f){
  await initPdf();
  const base=f.name.replace(/\.[^.]+$/,'');
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
  const dg=Math.max(3,String(pdf.numPages).length);
  for(let n=1;n<=pdf.numPages;n++){
    msg('讀取 '+f.name+' 第 '+n+'/'+pdf.numPages+' 頁…');
    const page=await pdf.getPage(n),vp=page.getViewport({scale:PDF_DPI/72});
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:g,viewport:vp}).promise;
    items.push({img:c,name:pdf.numPages>1?base+'-'+String(n).padStart(dg,'0'):base});
    page.cleanup();
  }
}
async function addImage(f){
  const name=f.name.replace(/\.[^.]+$/,'');
  let img;
  try{img=await createImageBitmap(f,{imageOrientation:'none'})}
  catch(e){img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)})}
  items.push({img,name});
}
async function addFiles(files){
  const arr=[...files].filter(f=>f.type.startsWith('image/')||isPdf(f)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  for(const f of arr){
    try{if(isPdf(f))await addPdf(f);else await addImage(f)}
    catch(e){msg('無法讀取 '+f.name+'：'+(e&&e.message||e));return}
    show();
  }
  msg('');
}
function msg(t){$('#msg').textContent=t}
function show(){
  applyNames();
  const grid=$('#grid');grid.innerHTML='';
  items.forEach((it,i)=>{
    const c=convert(it.img),d=document.createElement('div');d.className='it';
    d.innerHTML='<img alt=""><input type="text" class="nm"><div class="n"></div><button>下載這一張</button>';
    d.querySelector('img').src=c.toDataURL('image/jpeg',.7);
    const nm=d.querySelector('.nm');nm.value=it.name;
    nm.oninput=()=>{it.name=nm.value.trim()||it.base;it.manual=true;updateCode()};
    d.querySelector('.n').textContent='.jpg（'+c.width+' × '+c.height+'）';
    d.querySelector('button').onclick=async()=>save(it.name+'.jpg',await toBlob(convert(it.img)));
    grid.appendChild(d);
  });
  $('#dlz').disabled=$('#clr').disabled=!items.length;
  updateCode();
}
async function save(filename,blob){
  try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename,data:blob});return}}catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
}
$('#dlz').onclick=async()=>{
  if(!window.JSZip){msg('ZIP 元件載入失敗，請改用單張下載');return}
  const z=new JSZip(),used={};
  for(let i=0;i<items.length;i++){
    $('#msg').textContent='處理中 '+(i+1)+'/'+items.length;
    let n=items[i].name;used[n]=(used[n]||0)+1;if(used[n]>1)n+='-'+used[n];
    z.file(n+'.jpg',await toBlob(convert(items[i].img)));
  }
  await save('converted.zip',await z.generateAsync({type:'blob'}));msg('');
  if($('#cont').checked&&$('#auto').checked){$('#start').value=(parseInt($('#start').value)||0)+items.length;persist2();items.length=0;show();msg('已下載，下一個編號從 '+$('#start').value+' 開始')}
};
$('#clr').onclick=()=>{items.length=0;show()};
IDS.forEach(k=>$('#'+k).addEventListener('input',()=>{
  try{localStorage.setItem('cardCrop',JSON.stringify(Object.fromEntries(IDS.map(i=>[i,$('#'+i).value]))))}catch(e){}
  show();
}));
[...NV,...NC].forEach(k=>$('#'+k).addEventListener('input',()=>{persist2();if(k==='dir')updateCode();else show()}));
$('#renum').onclick=()=>{items.forEach(it=>delete it.manual);show()};
$('#cp').onclick=async()=>{
  const t=$('#code').value;if(!t)return;
  try{await navigator.clipboard.writeText(t)}catch(e){$('#code').select();document.execCommand('copy')}
  $('#cpmsg').textContent='已複製';setTimeout(()=>$('#cpmsg').textContent='',1500);
};
const dz=$('#drop');dz.onclick=()=>$('#file').click();
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
['dragover','dragenter'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
</script>
</body>
</html>
